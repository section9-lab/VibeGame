<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>VibeGame</title>
		<script>
			// 首帧就套用上次的主题，避免从默认深色闪一下才变浅色。
			try {
				document.documentElement.classList.toggle("dark", localStorage.getItem("vibegame-theme") !== "light");
			} catch {
				document.documentElement.classList.add("dark");
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
