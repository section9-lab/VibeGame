<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">VibeGame workspace</title>
  <desc id="desc">A VibeGame workspace with a conversational build log on the left and a neon 3D runner preview on the right.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F9FAFB"/><stop offset="1" stop-color="#EEF1F5"/></linearGradient>
    <linearGradient id="game" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111939"/><stop offset=".52" stop-color="#352365"/><stop offset="1" stop-color="#091020"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#191F42"/><stop offset="1" stop-color="#080B19"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#chrome)"/>
