  <text x="164" y="328" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">• 三车道无限跑酷，速度会随距离平滑提升</text>
  <text x="164" y="354" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">• 跳跃、滑铲和变道，配合能量环连击计分</text>
  <text x="164" y="380" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">• 碰撞反馈、最佳成绩和快捷重开均已加入</text>
  <rect x="164" y="404" width="154" height="30" rx="7" fill="#E9F0FF"/><text x="241" y="424" text-anchor="middle" fill="#155DFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600">查看生成的 game.ts</text>
  <rect x="144" y="480" width="560" height="155" rx="14" fill="#101827"/>
  <circle cx="168" cy="506" r="5" fill="#FF8A79"/><circle cx="184" cy="506" r="5" fill="#FFE075"/><circle cx="200" cy="506" r="5" fill="#72D7A5"/>
  <text x="166" y="540" fill="#9ED9FF" font-family="SFMono-Regular,Consolas,monospace" font-size="13">const LANES = [-2.2, 0, 2.2];</text>
  <text x="166" y="565" fill="#D8DEE9" font-family="SFMono-Regular,Consolas,monospace" font-size="13">export function setup(ctx) {</text>
  <text x="184" y="590" fill="#C3E88D" font-family="SFMono-Regular,Consolas,monospace" font-size="13">createNeonCanyon(ctx.scene);</text>
  <text x="166" y="615" fill="#D8DEE9" font-family="SFMono-Regular,Consolas,monospace" font-size="13">}</text>
