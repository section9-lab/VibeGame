  <rect x="1440" y="112" width="112" height="30" rx="8" fill="#155DFC"/><text x="1496" y="132" text-anchor="middle" fill="#FFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">↻ 重新运行</text>
