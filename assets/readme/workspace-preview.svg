  <rect x="688" y="113" width="126" height="30" rx="8" fill="#F3F4F6"/><text x="751" y="133" text-anchor="middle" fill="#9CA3AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">发布 · 即将开放</text>
  <rect x="144" y="178" width="445" height="66" rx="12" fill="#EFF5FF"/><text x="164" y="205" fill="#344B72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">我要做一个 3D 跑酷游戏，帮我设计一下。</text><text x="164" y="227" fill="#6980A7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">刚刚</text>
  <rect x="144" y="266" width="632" height="192" rx="14" fill="#F8FAFC" stroke="#E5E7EB"/>
  <circle cx="171" cy="293" r="14" fill="#155DFC"/><circle cx="166" cy="291" r="4" fill="#fff"/><circle cx="176" cy="291" r="4" fill="#fff"/>
