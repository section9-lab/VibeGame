  <circle cx="38" cy="38" r="8" fill="#FF5F57"/><circle cx="66" cy="38" r="8" fill="#FEBC2E"/><circle cx="94" cy="38" r="8" fill="#28C840"/>
  <text x="800" y="45" text-anchor="middle" fill="#4B5563" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600">VibeGame · Discover</text>
  <rect x="24" y="96" width="74" height="780" rx="18" fill="#F4F6F9" stroke="#E2E7EF"/>
  <path d="M43 128H77V162H43Z" fill="#155DFC"/><circle cx="54" cy="140" r="6" fill="#fff"/><circle cx="67" cy="140" r="6" fill="#fff"/>
  <circle cx="61" cy="209" r="18" fill="#155DFC"/><path d="M53 210h16M61 202v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="61" cy="829" r="18" fill="#E5E7EB"/><path d="M61 819v20M51 829h20" stroke="#64748B" stroke-width="2.5"/>
  <text x="150" y="167" fill="#162038" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="700">从一个念头，开始一局游戏。</text>
  <text x="150" y="205" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">选一个起点，VibeGame 会新建项目、写入玩法逻辑，并在右侧准备好可玩的预览。</text>
  <rect x="150" y="252" width="1360" height="1" fill="#E4E8F0"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(150 294)"><rect width="404" height="238" rx="20" fill="#FFF" stroke="#E1E6EF" stroke-width="2"/><rect x="16" y="16" width="372" height="116" rx="14" fill="url(#run)"/><path d="M50 117L156 37M156 37L258 117M258 117L338 55" stroke="#5BF4FF" stroke-width="5"/><circle cx="161" cy="71" r="17" fill="#FFE66D"/><rect x="45" y="55" width="42" height="62" rx="10" fill="#FF7B6C"/><text x="22" y="166" fill="#18233B" font-size="20" font-weight="700">3D 跑酷</text><text x="22" y="195" fill="#68758A" font-size="14">三车道、跳跃、滑铲与金币收集</text><rect x="22" y="207" width="114" height="20" rx="10" fill="#EAF0FF"/><text x="79" y="222" text-anchor="middle" fill="#155DFC" font-size="11" font-weight="700">立即开始 →</text></g>
    <g transform="translate(598 294)"><rect width="404" height="238" rx="20" fill="#FFF" stroke="#E1E6EF" stroke-width="2"/><rect x="16" y="16" width="372" height="116" rx="14" fill="url(#collect)"/><rect x="63" y="48" width="38" height="38" rx="8" fill="#FFE66D"/><rect x="176" y="65" width="38" height="38" rx="8" fill="#FF6B6B"/><rect x="286" y="36" width="38" height="38" rx="8" fill="#FDE68A"/><path d="M62 102L325 25" stroke="#9FFFEF" stroke-opacity=".48" stroke-width="4"/><text x="22" y="166" fill="#18233B" font-size="20" font-weight="700">收集小游戏</text><text x="22" y="195" fill="#68758A" font-size="14">移动方块，收集奖励，躲开危险</text><rect x="22" y="207" width="114" height="20" rx="10" fill="#E8FFFA"/><text x="79" y="222" text-anchor="middle" fill="#0D9488" font-size="11" font-weight="700">立即开始 →</text></g>
    <g transform="translate(1046 294)"><rect width="404" height="238" rx="20" fill="#FFF" stroke="#E1E6EF" stroke-width="2"/><rect x="16" y="16" width="372" height="116" rx="14" fill="url(#bounce)"/><circle cx="183" cy="60" r="27" fill="#FFF" fill-opacity=".9"/><path d="M45 104H145L183 86L230 104H359" stroke="#FFE5B4" stroke-width="8" stroke-linecap="round"/><path d="M183 82V35" stroke="#FFF" stroke-width="4" stroke-dasharray="6 7"/><text x="22" y="166" fill="#18233B" font-size="20" font-weight="700">弹跳球</text><text x="22" y="195" fill="#68758A" font-size="14">方向键控制，平台之间保持节奏</text><rect x="22" y="207" width="114" height="20" rx="10" fill="#FFF2DE"/><text x="79" y="222" text-anchor="middle" fill="#D97706" font-size="11" font-weight="700">立即开始 →</text></g>
    <g transform="translate(150 574)"><rect width="648" height="216" rx="20" fill="#FFF" stroke="#E1E6EF" stroke-width="2"/><rect x="16" y="16" width="194" height="184" rx="14" fill="url(#chess)"/><g fill="#8591A9"><rect x="38" y="40" width="28" height="28"/><rect x="98" y="40" width="28" height="28"/><rect x="158" y="40" width="28" height="28"/><rect x="68" y="70" width="28" height="28"/><rect x="128" y="70" width="28" height="28"/><rect x="38" y="100" width="28" height="28"/><rect x="98" y="100" width="28" height="28"/><rect x="158" y="100" width="28" height="28"/><rect x="68" y="130" width="28" height="28"/><rect x="128" y="130" width="28" height="28"/></g><circle cx="112" cy="92" r="15" fill="#A7F3D0"/><circle cx="155" cy="122" r="15" fill="#FCA5A5"/><text x="236" y="66" fill="#18233B" font-size="22" font-weight="700">3D 自走棋</text><text x="236" y="101" fill="#68758A" font-size="15">8×8 棋盘、商店刷新、羁绊与自动回合</text><text x="236" y="128" fill="#68758A" font-size="15">把策略规则交给 Agent，先试玩再继续迭代。</text><rect x="236" y="153" width="122" height="28" rx="8" fill="#EEF2F7"/><text x="297" y="172" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">创建项目 →</text></g>
    <g transform="translate(836 574)"><rect width="614" height="216" rx="20" fill="#FFF" stroke="#E1E6EF" stroke-width="2"/><rect x="16" y="16" width="184" height="184" rx="14" fill="url(#fps)"/><path d="M39 154L80 75L121 128L160 51" stroke="#77D7FF" stroke-width="3"/><circle cx="109" cy="97" r="31" stroke="#FFF" stroke-width="3"/><path d="M109 57V137M69 97H149" stroke="#FFF" stroke-opacity=".66" stroke-width="2"/><text x="226" y="66" fill="#18233B" font-size="22" font-weight="700">战术射击训练场</text><text x="226" y="101" fill="#68758A" font-size="15">第一人称移动、鼠标瞄准、靶场计时计分。</text><text x="226" y="128" fill="#68758A" font-size="15">用一句话建立第一个可操作的原型。</text><rect x="226" y="153" width="122" height="28" rx="8" fill="#EEF2F7"/><text x="287" y="172" text-anchor="middle" fill="#475569" font-size="12" font-weight="700">创建项目 →</text></g>
