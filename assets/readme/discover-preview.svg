<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">VibeGame idea gallery</title>
  <desc id="desc">The VibeGame discovery gallery showing game prompts for a 3D runner, collector, bouncing ball, auto battler, and tactical shooter.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="95" x2="1510" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF1FF"/></linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2B4EAF"/><stop offset="1" stop-color="#7F5CDB"/></linearGradient>
    <linearGradient id="collect" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14B8A6"/><stop offset="1" stop-color="#0E7490"/></linearGradient>
    <linearGradient id="bounce" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <linearGradient id="chess" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293247"/><stop offset="1" stop-color="#566076"/></linearGradient>
    <linearGradient id="fps" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="898" rx="31" stroke="#D2D8E3" stroke-width="2"/>
