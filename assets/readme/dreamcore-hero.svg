    </filter>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="tiles" width="92" height="50" patternUnits="userSpaceOnUse" patternTransform="skewX(-28) scale(1 .68)">
      <path d="M0 0H92V50H0z" fill="none" stroke="#D8E9FF" stroke-opacity=".38" stroke-width="2"/>
    </pattern>
    <pattern id="noise" width="17" height="17" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#fff" fill-opacity=".24"/>
      <circle cx="11" cy="8" r=".75" fill="#254B9C" fill-opacity=".20"/>
      <circle cx="6" cy="15" r=".5" fill="#fff" fill-opacity=".32"/>
    </pattern>
  </defs>
