<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Dreamlike blue arcade corridor</title>
  <desc id="desc">An empty liminal arcade corridor with blue tiled water, a glowing violet doorway, clouds, and a distant moon.</desc>
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE8FF"/>
      <stop offset=".54" stop-color="#A8C5FF"/>
      <stop offset="1" stop-color="#7196EB"/>
    </linearGradient>
    <linearGradient id="floor" x1="800" y1="312" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CC4F7"/>
      <stop offset="1" stop-color="#446CC0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="88" x2="0" y2="401" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9D9FF"/>
      <stop offset="1" stop-color="#7398E8"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F4EFFF"/>
      <stop offset=".43" stop-color="#C7B3FF"/>
      <stop offset="1" stop-color="#7056DB"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-60%" width="280%" height="220%">
