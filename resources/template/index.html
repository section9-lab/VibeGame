<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>VibeGame</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #0b0b10;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
		<script>
			// 预览页只做三件事：报错、报首帧、不碰父窗口的应用状态。
			const post = (message) => parent.postMessage({ source: "vibegame", ...message }, "*");
			addEventListener("error", (e) => post({ type: "error", message: String(e.message) }));
			addEventListener("unhandledrejection", (e) =>
				post({ type: "error", message: String((e.reason && e.reason.stack) || e.reason) }),
			);
			addEventListener("vibegame", (e) => post(e.detail));
		</script>
	</head>
	<body>
		<canvas id="game"></canvas>
		<script type="module" src="./app.js"></script>
	</body>
</html>
