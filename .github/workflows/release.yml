name: Release macOS

# 推送 vMAJOR.MINOR.PATCH（可带 -prerelease）标签即发布。
# 例：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: Build and release macOS arm64
    # macos-15 是 GitHub 的 arm64 runner；macos-14 是 Intel。
    runs-on: macos-15
    timeout-minutes: 60

    env:
      HUTCH_NO_UPDATE_CHECK: "1"
      HUTCH_RUNTIME: bun
      DMG_PATH: artifacts/macos-arm64-VibeGame.dmg
      KEYCHAIN_PATH: ${{ github.workspace }}/.build-signing.keychain-db
      # 六个签名相关 secret 全部存在时才签名/公证；部分存在会直接失败。
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.ELECTROBUN_DEVELOPER_ID != '' && secrets.ELECTROBUN_APPLEID != '' && secrets.ELECTROBUN_APPLEIDPASS != '' && secrets.ELECTROBUN_TEAMID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tag and compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag '$tag' is not a valid release tag." >&2
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, e.g. v1.2.3 or v1.2.3-beta.1." >&2
            exit 1
          fi

          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $tag (version $version, prerelease=$prerelease)"

      - name: Verify native arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -m), macOS $(sw_vers -productVersion)"
          test "$(uname -m)" = "arm64"
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != "1"

      - name: Install Hutch
        shell: bash
        run: |
          set -euo pipefail

          # 以 hutch.config.ts 的 pragma 为唯一版本来源，避免 CI 与项目 pin 漂移。
          hutch_version="$(sed -n 's|^// @hutch cli=\([^ ]*\).*|\1|p' hutch.config.ts)"
          if [[ -z "$hutch_version" ]]; then
            echo "Could not read the '// @hutch cli=...' pin from hutch.config.ts." >&2
            exit 1
          fi
          echo "HUTCH_VERSION=$hutch_version" >> "$GITHUB_ENV"

          installer="$RUNNER_TEMP/install-hutch.sh"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://hutch.blackboard.sh/hutch/install.sh \
            --output "$installer"
          sh "$installer" --channel production --version "$hutch_version" --no-modify-path

          test -x "$HOME/.hutch/bin/hutch"
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
          "$HOME/.hutch/bin/hutch" --version

      - name: Verify Hutch version
        shell: bash
        run: |
          set -euo pipefail
          installed="$(hutch --version | head -n 1)"
          case "$installed" in
            "$HUTCH_VERSION" | "hutch $HUTCH_VERSION") ;;
            *)
              echo "Expected Hutch $HUTCH_VERSION, got '$installed'." >&2
              exit 1
              ;;
          esac
          echo "Hutch $installed"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f hutch.lock
          hutch install
          if ! git diff --exit-code -- hutch.lock; then
            echo "hutch.lock changed during install. Commit the updated lockfile before tagging." >&2
            exit 1
          fi

      - name: Verify signing configuration
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
        run: |
          set -euo pipefail

          if [[ "$HAS_SIGNING" == "true" ]]; then
            echo "Apple signing and notarization secrets are configured."
            exit 0
          fi

          missing=""
          missing_count=0
          check_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              missing_count=$((missing_count + 1))
              missing="${missing:+$missing, }$name"
            fi
          }

          check_secret MACOS_CERTIFICATE "${MACOS_CERTIFICATE:-}"
          check_secret MACOS_CERTIFICATE_PWD "${MACOS_CERTIFICATE_PWD:-}"
          check_secret ELECTROBUN_DEVELOPER_ID "${ELECTROBUN_DEVELOPER_ID:-}"
          check_secret ELECTROBUN_APPLEID "${ELECTROBUN_APPLEID:-}"
          check_secret ELECTROBUN_APPLEIDPASS "${ELECTROBUN_APPLEIDPASS:-}"
          check_secret ELECTROBUN_TEAMID "${ELECTROBUN_TEAMID:-}"

          if [[ "$missing_count" -gt 0 && "$missing_count" -lt 6 ]]; then
            echo "Partial Apple signing configuration. Missing: $missing" >&2
            echo "Set all six secrets, or unset all of them for an unsigned build." >&2
            exit 1
          fi

          echo "::warning::No Apple signing secrets configured. Building an unsigned DMG."
          echo "Unsigned builds are fine for internal testing, but Gatekeeper blocks them for end users."

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
        run: |
          set -euo pipefail

          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p actions "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$ELECTROBUN_DEVELOPER_ID"

      - name: Build stable macOS arm64 DMG
        shell: bash
        env:
          VIBEGAME_VERSION: ${{ steps.version.outputs.version }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
        run: |
          set -euo pipefail
          # 主界面 dist 被 .gitignore 忽略，必须在 CI 里先构建。
          hutch scripts/build-ui.ts
          # 避免复用 runner 时把上一次的产物混进 Release。
          rm -rf artifacts
          hutch electrobun build --env=stable --arch=arm64

      - name: Verify DMG and release metadata
        shell: bash
        run: |
          set -euo pipefail

          test -f "$DMG_PATH"
          test -f artifacts/stable-macos-arm64-VibeGame.app.tar.zst
          test -f artifacts/stable-macos-arm64-update.json
          test -f artifacts/stable-macos-arm64-checksum.json

          python3 - <<'PY'
          import json
          import os

          expected = os.environ["VERSION"]
          with open("artifacts/stable-macos-arm64-update.json", encoding="utf-8") as f:
              update = json.load(f)
          assert update["version"] == expected, f"update.json version {update['version']!r} != {expected!r}"
          assert update["channel"] == "stable", update
          assert update["platform"] == "macos", update
          assert update["arch"] == "arm64", update
          assert update["artifact"]["file"] == "stable-macos-arm64-VibeGame.app.tar.zst", update
          print(f"update.json OK: {expected}")
          PY

          hdiutil verify "$DMG_PATH"

          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          app="$mount_point/VibeGame.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Contents/Info.plist" | grep -Fxq "$VERSION"
          file "$app/Contents/MacOS/launcher" | grep -q "arm64"

          if [[ "$HAS_SIGNING" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$DMG_PATH"
          fi

          echo "DMG verification passed."

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 \
            macos-arm64-VibeGame.dmg \
            stable-macos-arm64-VibeGame.app.tar.zst \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeGame-${{ steps.version.outputs.version }}-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/macos-arm64-VibeGame.dmg
            artifacts/stable-macos-arm64-VibeGame.app.tar.zst
            artifacts/stable-macos-arm64-update.json
            artifacts/stable-macos-arm64-checksum.json
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VibeGame ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/macos-arm64-VibeGame.dmg
            artifacts/stable-macos-arm64-VibeGame.app.tar.zst
            artifacts/stable-macos-arm64-update.json
            artifacts/stable-macos-arm64-checksum.json
            artifacts/SHA256SUMS.txt

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
